name: Release skill bundles

# Build every skill's .skill bundle and attach them to the GitHub Release whenever
# a vX.Y.Z tag is pushed. Keeps the README's releases/latest/download/... links
# self-maintaining.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build .skill bundles
        run: python3 scripts/build_skill_releases.py

      - name: Attach bundles to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.skill \
            --title "$GITHUB_REF_NAME" --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" dist/*.skill --clobber
